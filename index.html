<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اقامتگاه لوکس ونوس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" type="text/css" />
  <style>
    body { font-family: 'Vazirmatn FD', sans-serif; background-color: #090d16; color: #e2e8f0; }
    .glass-card { background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body>

  <!-- هدر -->
  <header class="p-6 text-center border-b border-white/10">
    <h1 class="text-2xl font-black text-white">اقامتگاه ونوس</h1>
  </header>

  <div class="max-w-4xl mx-auto p-4">
    <!-- اسلایدر -->
    <div class="swiper myGallerySwiper rounded-3xl overflow-hidden glass-card p-2">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="slide1.jpg" class="w-full h-64 object-cover"></div>
        <div class="swiper-slide"><img src="slide2.jpg" class="w-full h-64 object-cover"></div>
      </div>
    </div>

    <!-- گرید اتاق‌ها -->
    <div class="grid md:grid-cols-3 gap-6 mt-10">
      <div class="glass-card rounded-2xl p-4">
        <img src="room1.jpg" class="w-full h-40 object-cover rounded-xl mb-3">
        <h3 class="font-bold">اتاق ۱ تخته</h3>
      </div>
      <div class="glass-card rounded-2xl p-4">
        <img src="room2.jpg" class="w-full h-40 object-cover rounded-xl mb-3">
        <h3 class="font-bold">اتاق ۲ تخته</h3>
      </div>
      <div class="glass-card rounded-2xl p-4">
        <img src="room3.jpg" class="w-full h-40 object-cover rounded-xl mb-3">
        <h3 class="font-bold">فضای عمومی</h3>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper(".myGallerySwiper", { autoplay: { delay: 3000 }, loop: true });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ تگ تأیید گوگل -->
  <meta name="google-site-verification" content="GAPGPTMASKTOKEN2ah9wys8wheX0X" />

  <title>اقامتگاه لوکس ونوس | Venus Residence</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Swiper.js Slider CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Vazirmatn Font -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" type="text/css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn FD', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Vazirmatn FD', sans-serif; background-color: #090d16; color: #e2e8f0; overflow-x: hidden; }
    .glow-bg { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.35; z-index: 0; pointer-events: none; }
    .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .glass-card:hover { transform: translateY(-4px); border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 20px 40px -15px rgba(168, 85, 247, 0.25); }
    .badge-glow { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
    .swiper-pagination-bullet-active { background: #d946ef !important; width: 24px !important; border-radius: 9999px !important; }
    .swiper-pagination-bullet { background: #94a3b8; transition: all 0.3s; }
  </style>
</head>

<body class="relative selection:bg-fuchsia-500 selection:text-white">

  <!-- پس‌زمینه‌های نورانی -->
  <div class="glow-bg w-96 h-96 bg-purple-600 top-10 left-10"></div>
  <div class="glow-bg w-96 h-96 bg-pink-600 top-1/3 right-10"></div>
  <div class="glow-bg w-[30rem] h-[30rem] bg-indigo-600 bottom-10 left-1/3"></div>

  <!-- هدر -->
  <header class="sticky top-0 z-50 glass-nav">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
          <i class="fa-solid fa-hotel text-lg"></i>
        </div>
        <div>
          <span class="text-xl font-black tracking-tight text-white block">اقامتگاه ونوس</span>
          <span class="text-[10px] tracking-widest text-slate-400 font-semibold uppercase">Venus Residence</span>
        </div>
      </div>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
        <a href="#gallery" class="hover:text-fuchsia-400 transition-colors">گالری تصاویر</a>
        <a href="#rooms" class="hover:text-fuchsia-400 transition-colors">اتاق‌ها و امکانات</a>
        <a href="#booking" class="hover:text-fuchsia-400 transition-colors">رزرو و پذیرش</a>
      </nav>
      <a href="#booking" class="px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 transition-all">رزرو و پذیرش</a>
    </div>
  </header>

  <!-- هیرو و بقیه محتوا (مشابه نسخه شما) -->
  <section id="booking" class="relative z-10 max-w-5xl mx-auto px-6 py-12">
    <!-- جدول رزرو -->
    <div class="glass-card rounded-3xl overflow-hidden border border-fuchsia-500/30">
      <button onclick="toggleBookingTable()" class="w-full px-6 py-5 flex items-center justify-between bg-slate-900/60 hover:bg-slate-900/90 transition-all text-right">
        <span class="text-white font-bold text-base">مشاهده جدول کامل اتاق‌ها و رزرو سریع</span>
        <i id="toggleIcon" class="fa-solid fa-chevron-down text-fuchsia-400"></i>
      </button>

      <div id="bookingTableContent" class="p-4 sm:p-6 border-t border-slate-800 bg-slate-950/40 overflow-x-auto">
        <table class="w-full text-right text-xs sm:text-sm border-collapse min-w-[620px]">
          <!-- ردیف‌های جدول اینجا قرار دارند (همانند کد قبلی شما) -->
          <tbody class="divide-y divide-slate-800/60 text-slate-300">
             <!-- مثال یک ردیف -->
             <tr class="hover:bg-slate-900/40 transition-colors">
              <td class="py-3.5 px-4 font-semibold text-white">۳ تخته (شماره ۱۲)</td>
              <td class="py-3.5 px-4">۱۲</td>
              <td class="py-3.5 px-4">۱۲</td>
              <td class="py-3.5 px-4 text-center">
                <button onclick="openPaymentModal('۳ تخته (شماره ۱۲)', '۱۲ میلیون تومان', '۱۲ میلیون تومان')" class="px-3.5 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500 text-emerald-300 hover:text-white border border-emerald-500/30 transition-all font-semibold">رزرو</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- پاپ‌آپ پرداخت -->
  <div id="paymentModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card bg-slate-900/95 border border-fuchsia-500/40 rounded-3xl max-w-md w-full p-6 relative shadow-2xl text-right">
      <button onclick="closePaymentModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      
      <h3 class="text-base font-bold text-white mb-4">اطلاعات واریز بیعانه</h3>
      
      <!-- باکس کارت بانکی -->
      <div class="bg-gradient-to-br from-purple-950/60 to-slate-900 border border-purple-500/30 rounded-2xl p-4 mb-5 text-center">
        <span class="text-[11px] text-purple-300 block mb-1">شماره کارت جهت واریز</span>
        <div class="text-lg font-black tracking-widest text-yellow-300 dir-ltr my-2 select-all" id="cardNumber">۵۰۲۹-۳۸۱۰-۲۷۱۶-۹۲۸۳</div>
        <span class="text-xs text-slate-300 block">به نام: <strong class="text-white">فاطمه دلاوری</strong></span>
        
        <button onclick="copyCardNumber()" id="copyBtn" class="mt-3 inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-purple-500/20 hover:bg-purple-500 text-purple-300 hover:text-white border border-purple-500/40 text-xs font-semibold">
          <i class="fa-regular fa-copy"></i> <span id="copyText">کپی شماره کارت</span>
        </button>
      </div>

      <!-- دکمه ارسال فیش در بله -->
      <div class="space-y-2.5">
        <a href="https://ble.ir/dlv_venus" target="_blank" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          ارسال فیش واریزی در بله (Bale)
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    function toggleBookingTable() {
      document.getElementById('bookingTableContent').classList.toggle('hidden');
      document.getElementById('toggleIcon').classList.toggle('rotate-180');
    }

    function openPaymentModal(roomName, deposit, rent, date = '') {
      document.getElementById('modalRoomTitle').innerText = roomName;
      document.getElementById('paymentModal').classList.remove('hidden');
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').classList.add('hidden');
    }

    function copyCardNumber() {
      const cardNum = "5029381027169283"; 
      navigator.clipboard.writeText(cardNum).then(() => {
        const copyText = document.getElementById('copyText');
        copyText.innerText = "کپی شد! ✓";
        setTimeout(() => { copyText.innerText = "کپی شماره کارت"; }, 2500);
      });
    }
  </script>
</body>
</html>
